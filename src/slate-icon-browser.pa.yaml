            { Name: "notifications_active", Title: "Notifications Active", Cat: "Status", Tags: "bell ringing alert urgent", Path: "M7.58 4.08 6.15 2.65C3.75 4.48 2.17 7.3 2.03 10.5h2a8.445 8.445 0 0 1 3.55-6.42zm12.39 6.42h2c-.15-3.2-1.73-6.02-4.12-7.85l-1.42 1.43a8.495 8.495 0 0 1 3.54 6.42zM18 11c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2v-5zm-6 11c.14 0 .27-.01.4-.04.65-.14 1.18-.58 1.44-1.18.1-.24.15-.5.15-.78h-4c.01 1.1.9 2 2.01 2z" },
            { Name: "pending", Title: "Pending", Cat: "Status", Tags: "waiting progress clock", Path: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM7 13.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm5 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm5 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" },
            { Name: "priority_high", Title: "Priority High", Cat: "Status", Tags: "urgent important exclamation", Path: "M10 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0z M10 3h4v12h-4z" },
            { Name: "schedule", Title: "Schedule", Cat: "Status", Tags: "clock time due", Path: "M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z" },
            { Name: "task_alt", Title: "Task Alt", Cat: "Status", Tags: "complete done circle check", Path: "M22 5.18 10.59 16.6l-4.24-4.24 1.41-1.41 2.83 2.83 10-10L22 5.18zm-2.21 5.04c.13.57.21 1.17.21 1.78 0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8c1.58 0 3.04.46 4.28 1.25l1.44-1.44A9.9 9.9 0 0 0 12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10c0-1.19-.22-2.33-.6-3.39l-1.61 1.61z" },
            { Name: "verified", Title: "Verified", Cat: "Status", Tags: "approved certified badge", Path: "m23 12-2.44-2.79.34-3.69-3.61-.82-1.89-3.2L12 2.96 8.6 1.5 6.71 4.69 3.1 5.5l.34 3.7L1 12l2.44 2.79-.34 3.7 3.61.82L8.6 22.5l3.4-1.47 3.4 1.46 1.89-3.19 3.61-.82-.34-3.69L23 12zm-12.91 4.72-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z" },
            { Name: "verified_user", Title: "Verified User", Cat: "Status", Tags: "secure trusted shield", Path: "M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z" },
            { Name: "warning", Title: "Warning", Cat: "Status", Tags: "caution alert triangle", Path: "M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" },
            { Name: "access_time", Title: "Access Time", Cat: "Time", Tags: "clock hour duration", Path: "M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z" },
            { Name: "calendar_month", Title: "Calendar Month", Cat: "Time", Tags: "schedule date month", Path: "M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z" },
            { Name: "event", Title: "Event", Cat: "Time", Tags: "calendar appointment date", Path: "M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z" },
            { Name: "timer", Title: "Timer", Cat: "Time", Tags: "stopwatch countdown", Path: "M9 1h6v2H9zm10.03 6.39 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0 0 12 4a9 9 0 0 0-9 9c0 4.97 4.02 9 9 9a8.994 8.994 0 0 0 7.03-14.61zM13 14h-2V8h2v6z" },
            { Name: "today", Title: "Today", Cat: "Time", Tags: "date current day", Path: "M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z" },
            { Name: "update", Title: "Update", Cat: "Time", Tags: "refresh clock revision", Path: "M21 10.12h-6.78l2.74-2.82c-2.73-2.7-7.15-2.8-9.88-.1-2.73 2.71-2.73 7.08 0 9.79s7.15 2.71 9.88 0C18.32 15.65 19 14.08 19 12.1h2c0 1.98-.88 4.55-2.64 6.29-3.51 3.48-9.21 3.48-12.72 0-3.5-3.47-3.53-9.11-.02-12.58s9.14-3.47 12.65 0L21 3v7.12zM12.5 8v4.25l3.5 2.08-.72 1.21L11 13V8h1.5z" }
            )
        );
        Set(gblSlateBrandPath, LookUp(colSlateIcons, Name = "grid_view").Path);
    Children:
      # ------------------------------------------------------------ header
      - recSlateHeader:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =64
            Fill: =RGBA(31, 56, 100, 1)

      - imgSlateBrand:
          Control: Image
          Properties:
            X: =24
            Y: =16
            Width: =32
            Height: =32
            ImagePosition: =ImagePosition.Fit
            Image: |
              ="data:image/svg+xml;utf8," & EncodeUrl(
                  "<svg xmlns=""http://www.w3.org/2000/svg"" viewBox=""0 0 24 24"" fill=""#FFFFFF""><path d=""" &
                  Coalesce(gblSlateBrandPath, "M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z") &
                  """/></svg>"
              )

      - lblSlateTitle:
          Control: Label
          Properties:
            X: =68
            Y: =12
            Width: =520
            Height: =24
            Text: ="Slate"
            Color: =RGBA(255, 255, 255, 1)
            Size: =15
            FontWeight: =FontWeight.Semibold
            VerticalAlign: =VerticalAlign.Middle

      - lblSlateSubtitle:
          Control: Label
          Properties:
            X: =68
            Y: =34
            Width: =520
            Height: =20
            Text: ="Material Design icons as inline SVG — no CDN, no media files, GCC safe"
            Color: =RGBA(255, 255, 255, 0.72)
            Size: =9
            VerticalAlign: =VerticalAlign.Middle

      - lblSlateCount:
          Control: Label
          Properties:
            X: =Parent.Width - Self.Width - 24
            Y: =20
            Width: =260
            Height: =24
            Text: |
              =CountRows(galSlateIcons.AllItems) & " of " & CountRows(colSlateIcons) & " icons"
            Color: =RGBA(255, 255, 255, 0.72)
            Size: =10
            Align: =Align.Right
            VerticalAlign: =VerticalAlign.Middle

      # ----------------------------------------------------------- toolbar
      - txtSlateSearch:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =80
            Width: =360
            Height: =40
            Default: =""
            HintText: ="Search by name, category or keyword"
            Clear: =true
            Size: =11
            BorderColor: =RGBA(200, 204, 210, 1)

      - drpSlateCat:
          Control: Classic/DropDown
          Properties:
            X: =396
            Y: =80
            Width: =180
            Height: =40
            Items: =["All", "Action", "Communication", "Content", "Data", "Government", "Misc", "Navigation", "People", "Places", "Settings", "Status", "Time"]
            Default: ="All"
            Size: =11

      - drpSlateColor:
          Control: Classic/DropDown
          Properties:
            X: =588
            Y: =80
            Width: =150
            Height: =40
            Items: |
              =["#1F3864", "#0F6CBD", "#0B6A6A", "#107C10", "#A4262C", "#8A3FFC", "#605E5C", "#201F1E"]
            Default: ="#1F3864"
            Size: =11

      - drpSlateSize:
          Control: Classic/DropDown
          Properties:
            X: =750
            Y: =80
            Width: =110
            Height: =40
            Items: =["16", "20", "24", "32", "40", "48", "64"]
            Default: ="40"
            Size: =11

      # ------------------------------------------------------------- grid
      - galSlateIcons:
          Control: Gallery
          Variant: BrowseLayout_Vertical_TwoTextOneImage_VariantA_ver5.0
          Properties:
            X: =24
            Y: =136
            Width: =816
            Height: =Parent.Height - 160
            Layout: =Layout.Vertical
            WrapCount: =5
            TemplateSize: =124
            TemplatePadding: =0
            ShowScrollbar: =true
            Items: |
              =With(
                  {
                      q: Trim(txtSlateSearch.Value),
                      c: drpSlateCat.Selected.Value
                  },
                  Filter(
                      colSlateIcons,
                      (c = "All" || ThisRecord.Cat = c) &&
                      (
                          IsBlank(q) ||
                          q in ThisRecord.Name ||
                          q in ThisRecord.Title ||
                          q in ThisRecord.Tags
                      )
                  )
              )
          Children:
            - recSlateCell:
                Control: Rectangle
                Properties:
                  X: =4
                  Y: =4
                  Width: =Parent.TemplateWidth - 8
                  Height: =Parent.TemplateHeight - 8
                  Fill: |
                    =If(
                        ThisItem.IsSelected,
                        ColorFade(ColorValue(drpSlateColor.Selected.Value), 0.9),
                        RGBA(255, 255, 255, 1)
                    )
                  BorderColor: |
                    =If(
                        ThisItem.IsSelected,
                        ColorValue(drpSlateColor.Selected.Value),
                        RGBA(225, 228, 232, 1)
                    )
                  BorderThickness: =1

            - imgSlateIcon:
                Control: Image
                Properties:
                  Width: =Value(drpSlateSize.Selected.Value)
                  Height: =Self.Width
                  X: =(Parent.TemplateWidth - Self.Width) / 2
                  Y: =16
                  ImagePosition: =ImagePosition.Fit
                  # ---- THIS IS THE WHOLE TRICK ----------------------------
                  # A data URI is the only image source Power Apps will render
                  # from a formula. ";utf8," (not ";charset=utf-8,") and the
                  # explicit xmlns are both mandatory or you get a blank box.
                  # EncodeUrl escapes the markup; the fill colour must be a
                  # 6-digit hex, hence Left(RGBAToHex(...), 7).
                  Image: |
                    ="data:image/svg+xml;utf8," & EncodeUrl(
                        "<svg xmlns=""http://www.w3.org/2000/svg"" viewBox=""0 0 24 24"" fill=""" &
                        Left(RGBAToHex(ColorValue(drpSlateColor.Selected.Value)), 7) &
                        """><path d=""" & ThisItem.Path & """/></svg>"
                    )

            - lblSlateCellName:
                Control: Label
                Properties:
                  X: =8
                  Y: =Parent.TemplateHeight - 48
                  Width: =Parent.TemplateWidth - 16
                  Height: =36
                  Text: =ThisItem.Name
                  Size: =8
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Top
                  Color: =RGBA(70, 74, 80, 1)
                  Wrap: =true

      # ---------------------------------------------------------- detail
      - recSlateDetail:
          Control: Rectangle
          Properties:
            X: =864
            Y: =136
            Width: =Parent.Width - 888
            Height: =Parent.Height - 160
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(225, 228, 232, 1)
            BorderThickness: =1

      - imgSlateDetailIcon:
          Control: Image
          Properties:
            X: =recSlateDetail.X + 24
            Y: =recSlateDetail.Y + 24
            Width: =96
            Height: =96
            ImagePosition: =ImagePosition.Fit
            Image: |
              =If(
                  IsBlank(galSlateIcons.Selected),
                  Blank(),
                  "data:image/svg+xml;utf8," & EncodeUrl(
                      "<svg xmlns=""http://www.w3.org/2000/svg"" viewBox=""0 0 24 24"" fill=""" &
                      Left(RGBAToHex(ColorValue(drpSlateColor.Selected.Value)), 7) &
                      """><path d=""" & galSlateIcons.Selected.Path & """/></svg>"
                  )
              )

      - lblSlateDetailTitle:
          Control: Label
          Properties:
            X: =recSlateDetail.X + 136
            Y: =recSlateDetail.Y + 30
            Width: =recSlateDetail.Width - 160
            Height: =32
            Text: =Coalesce(galSlateIcons.Selected.Title, "Select an icon")
            Size: =16
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(32, 31, 30, 1)

      - lblSlateDetailMeta:
          Control: Label
          Properties:
            X: =recSlateDetail.X + 136
            Y: =recSlateDetail.Y + 64
            Width: =recSlateDetail.Width - 160
            Height: =44
            Text: |
              =If(
                  IsBlank(galSlateIcons.Selected),
                  "Pick any icon on the left to get its ready-to-paste Power Fx.",
                  galSlateIcons.Selected.Name & Char(10) & galSlateIcons.Selected.Cat
              )
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
            Wrap: =true

      - lblSlateSnippetCaption:
          Control: Label
          Properties:
            X: =recSlateDetail.X + 24
            Y: =recSlateDetail.Y + 144
            Width: =recSlateDetail.Width - 48
            Height: =24
            Text: ="Image property — select all, copy, paste"
            Size: =10
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(70, 74, 80, 1)

      - txtSlateSnippet:
          Control: Classic/TextInput
          Properties:
            X: =recSlateDetail.X + 24
            Y: =recSlateDetail.Y + 172
            Width: =recSlateDetail.Width - 48
            Height: =260
            Mode: =TextMode.MultiLine
            Size: =9
            Font: =Font.'Courier New'
            BorderColor: =RGBA(225, 228, 232, 1)
            Fill: =RGBA(250, 250, 251, 1)
            # Rebuilds the exact one-liner a developer needs. Char(34) is a
            # double quote; two of them produce the "" escape Power Fx wants
            # inside a string literal.
            Default: |
              =With(
                  {
                      q: Char(34),
                      qq: Char(34) & Char(34),
                      p: Coalesce(galSlateIcons.Selected.Path, "")
                  },
                  If(
                      IsBlank(galSlateIcons.Selected),
                      "",
                      q & "data:image/svg+xml;utf8," & q & " & EncodeUrl(" & q &
                      "<svg xmlns=" & qq & "http://www.w3.org/2000/svg" & qq &
                      " viewBox=" & qq & "0 0 24 24" & qq &
                      " fill=" & qq & drpSlateColor.Selected.Value & qq & ">" &
                      "<path d=" & qq & p & qq & "/></svg>" & q & ")"
                  )
              )

      - lblSlateFootnote:
          Control: Label
          Properties:
            X: =recSlateDetail.X + 24
            Y: =recSlateDetail.Y + 444
            Width: =recSlateDetail.Width - 48
            Height: =96
            Text: |
              ="Set the host Image control's ImagePosition to Fit — the SVG has no fixed size, so it scales to whatever Width and Height you give it. Swap the fill hex for Left(RGBAToHex(YourTheme.Primary), 7) to bind it to a theme."
            Size: =9
            Color: =RGBA(96, 94, 92, 1)
            Wrap: =true
