# ==============================================================================
# scrUIKit.pa.yaml   |   HCT Canvas UI Kit (reusable app elements)
# ------------------------------------------------------------------------------
# Power Apps canvas source, YAML v3. Classic controls + manual-layout containers
# only. No PCF, no component library, no App-level dependencies, no OnVisible.
#
# HOW TO USE
#   Studio paste : copy every "- name:" block under Children (all of it) and
#                  Ctrl+V onto a blank Tablet (1366 x 768) screen.
#   Source ctrl  : drop this file into Src/ of an unpacked .msapp.
#   Reuse        : each overlay is self-contained = 1 backdrop + 1 container
#                  + 1 timer (toasts add 1 auto-dismiss timer). Copy those
#                  and the loc* variables travel with them.
#
# Z-ORDER: children are listed back-to-front. Overlays are last so they sit on
# top of the demo content. If Studio shows them reversed, Reorder > Send to back.
#
# PALETTE (find/replace to bind to the theme system)
#   Primary  #1F4E79   Hover #183E60   Pressed #11304B   Tint RGBA(31,78,121,.10)
#   Text     #111827   Muted #6B7280   Border  #D1D5DB   Border-hover #9CA3AF
#   Surface  #FFFFFF   Canvas #F3F4F6  Soft #F9FAFB      Tray #E5E7EB
#   Success  #15803D   Warning #B45309 Danger #B91C1C    Info #1D4ED8
#
# ANIMATION PATTERN (all directional elements use the same three parts)
#   locXOpen = target state.   locXAnim = true while sliding.
#   timX runs 260 ms, then clears locXAnim.  Reset = !locXAnim rewinds it.
#   p = eased progress (1 when idle) drives X or Y and the backdrop alpha.
#   Elements stay Visible while (Open || Anim) so the exit slide renders.
#
# CONTEXT VARIABLES
#   Drawers  : locDrawerBottomOpen/Anim  locDrawerTopOpen/Anim
#              locDrawerLeftOpen/Anim    locDrawerRightOpen/Anim
#   Modal    : locModalOpen/Anim
#   Sidebars : locSidebarLeftOpen/Anim  locSidebarRightOpen/Anim  locNavLeft  locNavRight
#   Toasts   : locToastBROpen/Anim  locToastBLOpen/Anim  locToastTROpen/Anim  locToastTLOpen/Anim
#   Other    : locMenuOpen  locMenuChoice  locToggleOn  locTab  locAccordion  locFormReset
# ==============================================================================
Screens:
  scrUIKit:
    Properties:
      Fill: =ColorValue("#F3F4F6")
    Children:
      # ======================= HEADER =======================
      - lblKitTitle:
          Control: Label
          Properties:
            Text: ="HCT Canvas UI Kit"
            X: =40
            Y: =24
            Width: =600
            Height: =36
            Size: =22
            FontWeight: =FontWeight.Bold
            Color: =ColorValue("#111827")
      - lblKitSubtitle:
          Control: Label
          Properties:
            Text: ="Reusable canvas app elements. Every directional element is built once per direction. Select any control to see it work."
            X: =40
            Y: =60
            Width: =900
            Height: =24
            Size: =12
            Color: =ColorValue("#6B7280")

      # ======================= SECTION 1 · OVERLAY LAUNCHERS =======================
      - lblSecOverlays:
          Control: Label
          Properties:
            Text: ="OVERLAYS  ·  drawers, modal, toasts, sidebars"
            X: =40
            Y: =104
            Width: =600
            Height: =24
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =ColorValue("#6B7280")
      - galLaunchers:
          Control: Gallery
          Variant: galleryHorizontal
          Properties:
            X: =40
            Y: =130
            Width: =1010
            Height: =100
            TemplateSize: =162
            TemplatePadding: =4
            WrapCount: =2
            ShowNavigation: =false
            ShowScrollbar: =false
            Items: |-
              =Table(
                  {Key: "DB",  Label: "Drawer · bottom"},
                  {Key: "DT",  Label: "Drawer · top"},
                  {Key: "DL",  Label: "Drawer · left"},
                  {Key: "DR",  Label: "Drawer · right"},
                  {Key: "TBR", Label: "Toast · bottom right"},
                  {Key: "TBL", Label: "Toast · bottom left"},
                  {Key: "TTR", Label: "Toast · top right"},
                  {Key: "TTL", Label: "Toast · top left"},
                  {Key: "SL",  Label: "Sidebar · left"},
                  {Key: "SR",  Label: "Sidebar · right"},
                  {Key: "MD",  Label: "Modal"}
              )
          Children:
            - btnLauncher:
                Control: Classic/Button
                Properties:
                  Text: =ThisItem.Label
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  Size: =11
                  Fill: =Color.White
                  HoverFill: =ColorValue("#F9FAFB")
                  PressedFill: =ColorValue("#E5E7EB")
                  Color: =ColorValue("#111827")
                  HoverColor: =Self.Color
                  PressedColor: =Self.Color
                  BorderColor: =ColorValue("#D1D5DB")
                  HoverBorderColor: =ColorValue("#9CA3AF")
                  PressedBorderColor: =ColorValue("#9CA3AF")
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =Switch(ThisItem.Key,
                        "DB",  UpdateContext({locDrawerBottomOpen: true, locDrawerBottomAnim: true}),
                        "DT",  UpdateContext({locDrawerTopOpen: true, locDrawerTopAnim: true}),
                        "DL",  UpdateContext({locDrawerLeftOpen: true, locDrawerLeftAnim: true}),
                        "DR",  UpdateContext({locDrawerRightOpen: true, locDrawerRightAnim: true}),
                        "MD",  UpdateContext({locModalOpen: true, locModalAnim: true}),
                        "SL",  UpdateContext({locSidebarLeftOpen: true, locSidebarLeftAnim: true}),
                        "SR",  UpdateContext({locSidebarRightOpen: true, locSidebarRightAnim: true}),
                        "TBR", UpdateContext({locToastBROpen: true, locToastBRAnim: true}),
                        "TBL", UpdateContext({locToastBLOpen: true, locToastBLAnim: true}),
                        "TTR", UpdateContext({locToastTROpen: true, locToastTRAnim: true}),
                        "TTL", UpdateContext({locToastTLOpen: true, locToastTLAnim: true})
                    )

      # ======================= SECTION 2 · INPUTS & BUTTONS =======================
      - lblSecInputs:
          Control: Label
          Properties:
            Text: ="INPUTS & BUTTONS  ·  input, toggle, classic, outline, dropdown menu"
            X: =40
            Y: =250
            Width: =600
            Height: =24
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =ColorValue("#6B7280")

      # ---- Input ----
      - lblInputLabel:
          Control: Label
          Properties:
            Text: ="Full name"
            X: =40
            Y: =278
            Width: =300
            Height: =20
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =ColorValue("#374151")
      - txtInput:
          Control: Classic/TextInput
          Properties:
            HintText: ="Enter your name"
            Default: =""
            X: =40
            Y: =298
            Width: =300
            Height: =40
            Size: =12
            PaddingLeft: =12
            Fill: =Color.White
            Color: =ColorValue("#111827")
            BorderColor: =ColorValue("#D1D5DB")
            HoverBorderColor: =ColorValue("#9CA3AF")
            PressedBorderColor: =ColorValue("#1F4E79")
            FocusedBorderColor: =ColorValue("#1F4E79")
            BorderThickness: =1
            FocusedBorderThickness: =2
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8

      # ---- Toggle (pill track = button, knob = circle) ----
      - lblToggleLabel:
          Control: Label
          Properties:
            Text: ="Email notifications"
            X: =380
            Y: =278
            Width: =240
            Height: =20
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =ColorValue("#374151")
      - btnToggleTrack:
          Control: Classic/Button
          Properties:
            Text: =""
            X: =380
            Y: =304
            Width: =52
            Height: =28
            Fill: =If(locToggleOn, ColorValue("#1F4E79"), ColorValue("#D1D5DB"))
            HoverFill: =If(locToggleOn, ColorValue("#183E60"), ColorValue("#9CA3AF"))
            PressedFill: =Self.HoverFill
            BorderThickness: =0
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            OnSelect: |-
              =UpdateContext({locToggleOn: !locToggleOn})
      - cirToggleKnob:
          Control: Circle
          Properties:
            X: =btnToggleTrack.X + If(locToggleOn, 27, 3)
            Y: =btnToggleTrack.Y + 3
            Width: =22
            Height: =22
            Fill: =Color.White
            BorderThickness: =0
            OnSelect: =Select(btnToggleTrack)
      - lblToggleState:
          Control: Label
          Properties:
            Text: =If(locToggleOn, "On", "Off")
            X: =440
            Y: =304
            Width: =60
            Height: =28
            Size: =12
            VerticalAlign: =VerticalAlign.Middle
            Color: =ColorValue("#6B7280")

      # ---- Classic button ----
      - btnClassic:
          Control: Classic/Button
          Properties:
            Text: ="Classic button"
            X: =40
            Y: =356
            Width: =160
            Height: =40
            Size: =12
            FontWeight: =FontWeight.Semibold
            Fill: =ColorValue("#1F4E79")
            HoverFill: =ColorValue("#183E60")
            PressedFill: =ColorValue("#11304B")
            Color: =Color.White
            HoverColor: =Color.White
            PressedColor: =Color.White
            BorderThickness: =0
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            OnSelect: =Notify("Classic button selected", NotificationType.Information)

      # ---- Outline button ----
      - btnOutline:
          Control: Classic/Button
          Properties:
            Text: ="Outline button"
            X: =216
            Y: =356
            Width: =160
            Height: =40
            Size: =12
            FontWeight: =FontWeight.Semibold
            Fill: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(31, 78, 121, 0.08)
            PressedFill: =RGBA(31, 78, 121, 0.16)
            Color: =ColorValue("#1F4E79")
            HoverColor: =Self.Color
            PressedColor: =Self.Color
            BorderColor: =ColorValue("#1F4E79")
            HoverBorderColor: =Self.BorderColor
            PressedBorderColor: =Self.BorderColor
            BorderThickness: =2
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            OnSelect: =Notify("Outline button selected", NotificationType.Information)

      # ---- Dropdown menu trigger (panel is further down, above everything) ----
      - btnMenuTrigger:
          Control: Classic/Button
          Properties:
            Text: =Coalesce(locMenuChoice, "Actions") & "   ▾"
            X: =392
            Y: =356
            Width: =180
            Height: =40
            Size: =12
            Fill: =Color.White
            HoverFill: =ColorValue("#F9FAFB")
            PressedFill: =ColorValue("#E5E7EB")
            Color: =ColorValue("#111827")
            HoverColor: =Self.Color
            PressedColor: =Self.Color
            BorderColor: =ColorValue("#D1D5DB")
            HoverBorderColor: =ColorValue("#9CA3AF")
            PressedBorderColor: =ColorValue("#9CA3AF")
            BorderThickness: =1
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            OnSelect: |-
              =UpdateContext({locMenuOpen: !locMenuOpen})

      # ======================= SECTION 3 · NAVIGATION & LAYOUT =======================
      - lblSecLayout:
          Control: Label
          Properties:
            Text: ="NAVIGATION & LAYOUT  ·  tab bar, accordion, dynamic form card"
            X: =40
            Y: =416
            Width: =600
            Height: =24
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =ColorValue("#6B7280")

      # ---- Tab bar (data-driven, pill-in-tray) ----
      - conTabBar:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =40
            Y: =444
            Width: =380
            Height: =44
            Fill: =ColorValue("#E5E7EB")
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
          Children:
            - galTabs:
                Control: Gallery
                Variant: galleryHorizontal
                Properties:
                  X: =4
                  Y: =4
                  Width: =Parent.Width - 8
                  Height: =Parent.Height - 8
                  TemplateSize: =Self.Width / 3
                  TemplatePadding: =0
                  ShowNavigation: =false
                  ShowScrollbar: =false
                  Items: |-
                    =Table(
                        {Id: 1, Name: "Overview"},
                        {Id: 2, Name: "Details"},
                        {Id: 3, Name: "History"}
                    )
                Children:
                  - btnTab:
                      Control: Classic/Button
                      Properties:
                        Text: =ThisItem.Name
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                        Fill: =If(Coalesce(locTab, 1) = ThisItem.Id, Color.White, RGBA(0, 0, 0, 0))
                        HoverFill: =If(Coalesce(locTab, 1) = ThisItem.Id, Color.White, RGBA(255, 255, 255, 0.5))
                        PressedFill: =Color.White
                        Color: =If(Coalesce(locTab, 1) = ThisItem.Id, ColorValue("#111827"), ColorValue("#6B7280"))
                        HoverColor: =ColorValue("#111827")
                        PressedColor: =ColorValue("#111827")
                        BorderThickness: =0
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        OnSelect: |-
                          =UpdateContext({locTab: ThisItem.Id})
      - conTabContent:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =40
            Y: =496
            Width: =380
            Height: =120
            Fill: =Color.White
            BorderColor: =ColorValue("#D1D5DB")
            BorderThickness: =1
            RadiusTopLeft: =10
            RadiusTopRight: =10
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
          Children:
            - lblTabContentTitle:
                Control: Label
                Properties:
                  Text: =Switch(Coalesce(locTab, 1), 1, "Overview", 2, "Details", 3, "History")
                  X: =20
                  Y: =16
                  Width: =Parent.Width - 40
                  Height: =24
                  Size: =14
                  FontWeight: =FontWeight.Semibold
                  Color: =ColorValue("#111827")
            - lblTabContentBody:
                Control: Label
                Properties:
                  Text: |-
                    =Switch(Coalesce(locTab, 1),
                        1, "Tabs are a gallery over a table, so adding a tab is adding a row. The selected Id lives in locTab.",
                        2, "Swap this label for a form, a gallery, or a nested container. Visibility keys off locTab.",
                        3, "Panels are cheap to add. Keep the tab table and the Switch in sync and nothing else changes."
                    )
                  X: =20
                  Y: =44
                  Width: =Parent.Width - 40
                  Height: =64
                  Size: =12
                  Wrap: =true
                  VerticalAlign: =VerticalAlign.Top
                  Color: =ColorValue("#6B7280")

      # ---- Accordion (single-open, three stacked sections) ----
      - conAccordion:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =460
            Y: =444
            Width: =380
            Height: =lblAcc3.Y + lblAcc3.Height
            Fill: =Color.White
            BorderColor: =ColorValue("#D1D5DB")
            BorderThickness: =1
            RadiusTopLeft: =10
            RadiusTopRight: =10
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            DropShadow: =DropShadow.Light
          Children:
            - btnAcc1:
                Control: Classic/Button
                Properties:
                  Text: =If(locAccordion = 1, "▾", "▸") & "    What is in the kit?"
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =44
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Left
                  PaddingLeft: =16
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =ColorValue("#F9FAFB")
                  PressedFill: =ColorValue("#F3F4F6")
                  Color: =ColorValue("#111827")
                  HoverColor: =Self.Color
                  PressedColor: =Self.Color
                  BorderThickness: =0
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  OnSelect: |-
                    =UpdateContext({locAccordion: If(locAccordion = 1, 0, 1)})
            - lblAcc1:
                Control: Label
                Properties:
                  Text: ="Four drawers, a modal, four toasts, two sidebars, a dropdown menu, a tab bar, this accordion, an input, a toggle, two button styles and a dynamic form card."
                  X: =0
                  Y: =btnAcc1.Y + btnAcc1.Height
                  Width: =Parent.Width
                  Height: =If(locAccordion = 1, 84, 0)
                  Visible: =locAccordion = 1
                  Size: =12
                  Wrap: =true
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =6
                  VerticalAlign: =VerticalAlign.Top
                  Fill: =ColorValue("#F9FAFB")
                  Color: =ColorValue("#6B7280")
            - btnAcc2:
                Control: Classic/Button
                Properties:
                  Text: =If(locAccordion = 2, "▾", "▸") & "    How do the animations work?"
                  X: =0
                  Y: =lblAcc1.Y + lblAcc1.Height
                  Width: =Parent.Width
                  Height: =44
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Left
                  PaddingLeft: =16
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =ColorValue("#F9FAFB")
                  PressedFill: =ColorValue("#F3F4F6")
                  Color: =ColorValue("#111827")
                  HoverColor: =Self.Color
                  PressedColor: =Self.Color
                  BorderThickness: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  OnSelect: |-
                    =UpdateContext({locAccordion: If(locAccordion = 2, 0, 2)})
            - lblAcc2:
                Control: Label
                Properties:
                  Text: ="One Timer per element. An Open flag sets the target, an Anim flag runs the timer, and eased progress drives X or Y. No PCF, no HTML, no App formulas."
                  X: =0
                  Y: =btnAcc2.Y + btnAcc2.Height
                  Width: =Parent.Width
                  Height: =If(locAccordion = 2, 84, 0)
                  Visible: =locAccordion = 2
                  Size: =12
                  Wrap: =true
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =6
                  VerticalAlign: =VerticalAlign.Top
                  Fill: =ColorValue("#F9FAFB")
                  Color: =ColorValue("#6B7280")
            - btnAcc3:
                Control: Classic/Button
                Properties:
                  Text: =If(locAccordion = 3, "▾", "▸") & "    How do I reuse an element?"
                  X: =0
                  Y: =lblAcc2.Y + lblAcc2.Height
                  Width: =Parent.Width
                  Height: =44
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Left
                  PaddingLeft: =16
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =ColorValue("#F9FAFB")
                  PressedFill: =ColorValue("#F3F4F6")
                  Color: =ColorValue("#111827")
                  HoverColor: =Self.Color
                  PressedColor: =Self.Color
                  BorderThickness: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =If(locAccordion = 3, 0, 10)
                  RadiusBottomRight: =If(locAccordion = 3, 0, 10)
                  OnSelect: |-
                    =UpdateContext({locAccordion: If(locAccordion = 3, 0, 3)})
            - lblAcc3:
                Control: Label
                Properties:
                  Text: ="Copy the container, its backdrop and its timer together. Rename the loc variables if two of the same element share a screen."
                  X: =0
                  Y: =btnAcc3.Y + btnAcc3.Height
                  Width: =Parent.Width
                  Height: =If(locAccordion = 3, 84, 0)
                  Visible: =locAccordion = 3
                  Size: =12
                  Wrap: =true
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =6
                  VerticalAlign: =VerticalAlign.Top
                  Fill: =ColorValue("#F9FAFB")
                  Color: =ColorValue("#6B7280")

      # ---- Dynamic form card (fields generated from a table) ----
      - conFormCard:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =880
            Y: =444
            Width: =440
            Height: =300
            Fill: =Color.White
            BorderColor: =ColorValue("#D1D5DB")
            BorderThickness: =1
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            DropShadow: =DropShadow.Light
          Children:
            - lblFormTitle:
                Control: Label
                Properties:
                  Text: ="New training request"
                  X: =20
                  Y: =14
                  Width: =Parent.Width - 40
                  Height: =26
                  Size: =14
                  FontWeight: =FontWeight.Semibold
                  Color: =ColorValue("#111827")
            - lblFormSubtitle:
                Control: Label
                Properties:
                  Text: ="Fields come from a table. Add a row to add a field."
                  X: =20
                  Y: =38
                  Width: =Parent.Width - 40
                  Height: =20
                  Size: =11
                  Color: =ColorValue("#6B7280")
            - galFormFields:
                Control: Gallery
                Variant: galleryVertical
                Properties:
                  X: =20
                  Y: =66
                  Width: =Parent.Width - 40
                  Height: =180
                  TemplateSize: =60
                  TemplatePadding: =0
                  ShowScrollbar: =false
                  Items: |-
                    =Table(
                        {Field: "Requester",     Hint: "Full name",                 Required: true},
                        {Field: "Duty station",  Hint: "e.g. NCR",                  Required: true},
                        {Field: "Justification", Hint: "One line is enough",        Required: false}
                    )
                Children:
                  - lblField:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Field & If(ThisItem.Required, " *", "")
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =18
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        Color: =ColorValue("#374151")
                  - txtField:
                      Control: Classic/TextInput
                      Properties:
                        HintText: =ThisItem.Hint
                        Default: =""
                        Reset: =locFormReset
                        X: =0
                        Y: =20
                        Width: =Parent.TemplateWidth
                        Height: =34
                        Size: =12
                        PaddingLeft: =12
                        Fill: =Color.White
                        Color: =ColorValue("#111827")
                        BorderColor: =ColorValue("#D1D5DB")
                        HoverBorderColor: =ColorValue("#9CA3AF")
                        PressedBorderColor: =ColorValue("#1F4E79")
                        FocusedBorderColor: =ColorValue("#1F4E79")
                        BorderThickness: =1
                        FocusedBorderThickness: =2
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
            - btnFormReset:
                Control: Classic/Button
                Properties:
                  Text: ="Reset"
                  X: =Parent.Width - 20 - 120 - 8 - 100
                  Y: =Parent.Height - 52
                  Width: =100
                  Height: =36
                  Size: =12
                  Fill: =Color.White
                  HoverFill: =ColorValue("#F9FAFB")
                  PressedFill: =ColorValue("#E5E7EB")
                  Color: =ColorValue("#111827")
                  HoverColor: =Self.Color
                  PressedColor: =Self.Color
                  BorderColor: =ColorValue("#D1D5DB")
                  HoverBorderColor: =ColorValue("#9CA3AF")
                  PressedBorderColor: =ColorValue("#9CA3AF")
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =UpdateContext({locFormReset: true});
                    UpdateContext({locFormReset: false})
            - btnFormSubmit:
                Control: Classic/Button
                Properties:
                  Text: ="Submit"
                  X: =Parent.Width - 20 - 120
                  Y: =Parent.Height - 52
                  Width: =120
                  Height: =36
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Fill: =ColorValue("#1F4E79")
                  HoverFill: =ColorValue("#183E60")
                  PressedFill: =ColorValue("#11304B")
                  Color: =Color.White
                  HoverColor: =Color.White
                  PressedColor: =Color.White
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =If(
                        CountRows(Filter(galFormFields.AllItems, Required && IsBlank(Trim(txtField.Text)))) > 0,
                        Notify("Complete the required fields.", NotificationType.Warning),
                        Notify("Submitted  ·  " & Concat(galFormFields.AllItems, Field & " = " & txtField.Text, ";  "), NotificationType.Success)
                    )

      # ======================= DROPDOWN MENU (panel + click-away) =======================
      - recMenuClickAway:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 0, 0, 0.01)
            BorderThickness: =0
            Visible: =locMenuOpen
            OnSelect: |-
              =UpdateContext({locMenuOpen: false})
      - conMenu:
